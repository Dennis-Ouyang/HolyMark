[package]
name = "holymark"
version = "0.1.0"
description = "HolyMark：面向长篇中文写作的本地 Markdown 编辑器"
edition = "2021"

[lib]
name = "holymark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
sha2 = "0.10"
fontdb = "0.22"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 删除文件时移到废纸篓 / 回收站，而不是直接删掉
trash = "5"
# 用 DOI 取 BibTeX（只在用户主动操作时联网）
ureq = "2"

# Windows / Linux：再次双击 .md 时交给已经打开的窗口（macOS 系统本身就是单实例）
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
