[package]
name = "holymark"
version = "0.1.0"
description = "HolyMark：面向长篇中文写作的本地 Markdown 编辑器"
edition = "2021"

[lib]
name = "holymark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
sha2 = "0.10"
fontdb = "0.22"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
